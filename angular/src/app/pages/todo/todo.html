<body>
    <main>
        <app-navbar />
        <div class="main">
            <div>
                <input
                    class="main-input"
                    type="text"
                    placeholder="Add todo"
                    [value]="newItem()"
                    (input)="newItem.set($any($event.target).value)"
                />
                <button (click)="addItem()">Add Todo</button>
            </div>

            <div
                cdkDropList
                (cdkDropListDropped)="drop($event)"
            >
                @for (item of items(); track item.id ) {
                    <div cdkDrag>
                        <app-item
                            [todo]="item"
                            (toggle)="toggleItem(item.id)"
                            (deleteTodo)="deleteItem(item.id)"
                        />
                    </div>
                }
            </div>
        </div>
    </main>
</body>
